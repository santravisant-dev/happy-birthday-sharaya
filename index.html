<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sharaya ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="welcome" class="screen">
    <h1>🎉 Happy Birthday Sharaya 🎉</h1>
    <p>Today is all about you ❤️</p>

    <h2>Are you excited for what's next?</h2>

    <div class="buttons">
        <button id="yesBtn">YES 💖</button>
        <button id="noBtn">NO 🙈</button>
    </div>
</div>

<div id="balloonScreen" class="screen hidden">
    <h1>🎈 Pop all 4 balloons!</h1>

    <div id="balloons">
        <div class="balloon red">🎈</div>
        <div class="balloon blue">🎈</div>
        <div class="balloon green">🎈</div>
        <div class="balloon yellow">🎈</div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
